name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: RpnSolver host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: make -C test test

  build-sketch:
    name: Compile ESP8266 sketch
    runs-on: ubuntu-latest
    env:
      ESP8266_URL: https://arduino.esp8266.com/stable/package_esp8266com_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      # versions pinned to the locally-verified toolchain
      - name: Install core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP8266_URL"
          arduino-cli core install esp8266:esp8266@3.1.2 --additional-urls "$ESP8266_URL"
          arduino-cli lib install ArduinoJson@7.4.3
          # FastTimer 3.1.0 is not on the Library Manager index yet: install the tag from git
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install --git-url https://github.com/1e1/Arduino-FastTimer.git#3.1.0
      - name: Compile
        run: arduino-cli compile --fqbn esp8266:esp8266:d1_mini sketch_wiscan
